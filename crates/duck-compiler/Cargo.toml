[package]
name = "duck-compiler"
version = "0.1.0"
edition = "2024"

[features]
# The WIT of `wasi:webgpu` and of the surface and the frame buffer of
# `wasi-gfx`, which `duck run` gives a program beside WASI 0.3.
gfx = []

[dependencies]
# The hash of every map of the compiler: fast on the short names and ids it
# keys them by, and the same from one build to the next.
rustc-hash = "2.1.3"
wasm-encoder = "0.259.0"
wit-component = "0.258.3"
wit-parser = "0.258.3"

[dev-dependencies]
# What runs the modules the tests compile, and what the evaluator is
# checked against: a wasm engine that compiles them for the machine.
wasmtime = { version = "49.0.2", default-features = false, features = ["runtime", "cranelift", "gc", "gc-null", "backtrace", "std"] }
wasmparser = "0.259.0"
wasmprinter = "0.259.0"
